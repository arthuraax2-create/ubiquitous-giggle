<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Bot V 1.3</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --bg: #0d1117; --card: #161b22; --border: #30363d; --text: #c9d1d9; --muted: #8b949e; --accent: #58a6ff; --green: #3fb950; --red: #f85149; --yellow: #d29922; --purple: #a371f7; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header { background: var(--card); border-bottom: 1px solid var(--border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .logo { font-size: 1.3em; font-weight: bold; background: linear-gradient(90deg, var(--accent), var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .version { background: var(--purple); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; }
        .status-badge { display: flex; align-items: center; gap: 8px; padding: 8px 15px; border-radius: 20px; font-size: 0.9em; }
        .status-badge.online { background: rgba(63, 185, 80, 0.2); color: var(--green); }
        .status-badge.offline { background: rgba(248, 81, 73, 0.2); color: var(--red); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .btn { padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9em; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: #79c0ff; }
        .btn-danger { background: var(--red); color: white; }
        .nav { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 20px; display: flex; gap: 5px; overflow-x: auto; }
        .nav-item { padding: 15px 20px; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s; }
        .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.05); }
        .nav-item.active { color: var(--accent); border-bottom-color: var(--accent); }
        .content { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .tab { display: none; }
        .tab.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-weight: 600; }
        .card-body { padding: 20px; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .stat { text-align: center; padding: 15px; background: var(--bg); border-radius: 8px; }
        .stat-value { font-size: 1.5em; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.8em; color: var(--muted); margin-top: 5px; }
        .server-card { cursor: pointer; transition: all 0.2s; }
        .server-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .player-list { max-height: 400px; overflow-y: auto; }
        .player-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--bg); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .player-item:hover { background: rgba(255,255,255,0.05); }
        .player-avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; }
        .player-info { flex: 1; }
        .player-name { font-weight: 500; }
        .player-meta { font-size: 0.8em; color: var(--muted); }
        .logs { background: var(--bg); border-radius: 8px; padding: 15px; max-height: 400px; overflow-y: auto; font-family: monospace; font-size: 0.85em; }
        .log-entry { padding: 4px 0; border-bottom: 1px solid var(--border); }
        .log-time { color: var(--muted); margin-right: 10px; }
        .log-info { color: var(--text); }
        .log-warn { color: var(--yellow); }
        .log-error { color: var(--red); }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 5px; font-size: 0.9em; color: var(--muted); }
        .form-input { width: 100%; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 1em; }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; max-width: 500px; width: 90%; max-height: 80vh; overflow: auto; }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; }
        .modal-close { background: none; border: none; color: var(--muted); font-size: 1.5em; cursor: pointer; }
        .popup { position: fixed; bottom: 20px; right: 20px; width: 350px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: none; z-index: 1000; }
        .popup.active { display: block; }
        .popup-header { padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .popup-body { padding: 15px; max-height: 300px; overflow-y: auto; }
        .tag { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 0.75em; margin: 2px; }
        .tag-green { background: rgba(63, 185, 80, 0.2); color: var(--green); }
        .tag-red { background: rgba(248, 81, 73, 0.2); color: var(--red); }
        .tag-blue { background: rgba(88, 166, 255, 0.2); color: var(--accent); }
        .toast-container { position: fixed; bottom: 20px; left: 20px; z-index: 1000; }
        .toast { background: var(--card); border: 1px solid var(--border); padding: 12px 20px; border-radius: 8px; margin-top: 10px; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(-100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <span class="logo">🎮 Minecraft Bot</span>
            <span class="version">V 1.3</span>
        </div>
        <div style="display: flex; align-items: center; gap: 15px;">
            <div class="status-badge offline" id="connectionStatus">
                <div class="status-dot"></div>
                <span id="connectionText">Conectando...</span>
            </div>
            <button class="btn btn-primary" onclick="showModal('server')">+ Servidor</button>
        </div>
    </div>
    
    <div class="nav">
        <div class="nav-item active" data-tab="dashboard">📊 Dashboard</div>
        <div class="nav-item" data-tab="servers">🖥️ Servidores</div>
        <div class="nav-item" data-tab="players">👥 Players</div>
        <div class="nav-item" data-tab="messages">📢 Mensagens</div>
        <div class="nav-item" data-tab="logs">📜 Logs</div>
        <div class="nav-item" data-tab="settings">⚙️ Config</div>
    </div>
    
    <div class="content">
        <div class="tab active" id="tab-dashboard">
            <div class="grid">
                <div class="card">
                    <div class="card-header"><span class="card-title">📊 Status</span></div>
                    <div class="card-body">
                        <div class="stats">
                            <div class="stat"><div class="stat-value" id="totalServers">0</div><div class="stat-label">Servidores</div></div>
                            <div class="stat"><div class="stat-value" id="totalBots">0</div><div class="stat-label">Bots</div></div>
                            <div class="stat"><div class="stat-value" id="totalPlayers">0</div><div class="stat-label">Players</div></div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><span class="card-title">🔗 Conexão</span></div>
                    <div class="card-body">
                        <p>Local: <code>http://localhost:15294</code></p>
                        <p>Externo: <code id="externalUrl">--</code></p>
                    </div>
                </div>
            </div>
            <h3 style="margin: 20px 0 15px;">Servidores</h3>
            <div class="grid" id="serversGrid"></div>
        </div>
        
        <div class="tab" id="tab-servers">
            <div class="card">
                <div class="card-header"><span class="card-title">🖥️ Servidores</span><button class="btn btn-primary" onclick="showModal('server')">+ Adicionar</button></div>
                <div class="card-body" id="serversList"></div>
            </div>
        </div>
        
        <div class="tab" id="tab-players">
            <div class="card">
                <div class="card-header"><span class="card-title">👥 Players</span></div>
                <div class="card-body"><div class="player-list" id="playersList"></div></div>
            </div>
        </div>
        
        <div class="tab" id="tab-messages">
            <div class="grid">
                <div class="card">
                    <div class="card-header"><span class="card-title">📢 Anúncios</span></div>
                    <div class="card-body">
                        <div id="messagesList"></div>
                        <div style="margin-top: 15px;">
                            <input type="text" class="form-input" id="newMessage" placeholder="Nova mensagem...">
                            <button class="btn btn-primary" style="margin-top: 10px;" onclick="addMessage()">Adicionar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="tab" id="tab-logs">
            <div class="card">
                <div class="card-header"><span class="card-title">📜 Logs</span><button class="btn btn-primary" onclick="clearLogs()">Limpar</button></div>
                <div class="card-body"><div class="logs" id="logsContainer"></div></div>
            </div>
        </div>
        
        <div class="tab" id="tab-settings">
            <div class="card">
                <div class="card-header"><span class="card-title">⚙️ Configurações</span></div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label">Intervalo Anúncios (seg)</label>
                        <input type="number" class="form-input" id="settingInterval" value="120">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Senha</label>
                        <input type="text" class="form-input" id="settingPassword" value="senha123456">
                    </div>
                    <button class="btn btn-primary" onclick="saveSettings()">Salvar</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="modal-server">
        <div class="modal-content">
            <div class="modal-header"><h3>+ Adicionar Servidor</h3><button class="modal-close" onclick="hideModal('server')">&times;</button></div>
            <div class="modal-body">
                <div class="form-group"><label class="form-label">Nome</label><input type="text" class="form-input" id="serverName"></div>
                <div class="form-group"><label class="form-label">Host</label><input type="text" class="form-input" id="serverHost"></div>
                <div class="form-group"><label class="form-label">Porta</label><input type="number" class="form-input" id="serverPort" value="25565"></div>
                <button class="btn btn-primary" style="width: 100%;" onclick="addServer()">Adicionar</button>
            </div>
        </div>
    </div>
    
    <div class="popup" id="playerPopup">
        <div class="popup-header"><h4 id="playerPopupName">Player</h4><button class="modal-close" onclick="hidePopup()">&times;</button></div>
        <div class="popup-body"><div id="playerPopupContent"></div></div>
    </div>
    
    <div class="toast-container" id="toasts"></div>
    
    <script>
        let socket = null;
        let config = {};
        let botStatus = { servers: [] };
        let playersData = { players: {}, toxic: [] };
        
        function connect() {
            socket = io(window.location.origin, { transports: ['websocket', 'polling'] });
            socket.on('connect', () => { setStatus(true); toast('Conectado!', 'success'); });
            socket.on('disconnect', () => setStatus(false));
            socket.on('config', (c) => { config = c; updateUI(); });
            socket.on('bot:status', (s) => { botStatus = s; updateDashboard(); });
            socket.on('bot:log', (d) => addLog(d.message, d.level, d.serverId, d.timestamp));
            socket.on('bot:logs', (l) => { document.getElementById('logsContainer').innerHTML = ''; l.forEach(x => addLog(x.message, x.level, x.serverId, x.timestamp)); });
            socket.on('players:data', (d) => { playersData = d; updatePlayers(); });
            socket.on('bot:player_event', (d) => toast(`${d.player} ${d.type === 'join' ? 'entrou' : 'saiu'}`, 'info'));
            socket.on('server:added', (s) => toast(`Servidor ${s.name} adicionado!`, 'success'));
        }
        
        function setStatus(online) {
            const b = document.getElementById('connectionStatus');
            const t = document.getElementById('connectionText');
            b.className = 'status-badge ' + (online ? 'online' : 'offline');
            t.textContent = online ? 'Online' : 'Offline';
        }
        
        function updateUI() {
            document.getElementById('messagesList').innerHTML = (config.messages || []).map((m, i) => `<div class="player-item"><span>${m}</span><button class="btn btn-danger" style="padding: 5px 10px; margin-left: auto;" onclick="removeMessage(${i})">✕</button></div>`).join('');
            document.getElementById('settingInterval').value = config.botSettings?.announcementInterval || 120;
            document.getElementById('settingPassword').value = config.auth?.password || 'senha123456';
            if (config.relay?.externalUrl) document.getElementById('externalUrl').textContent = config.relay.externalUrl;
        }
        
        function updateDashboard() {
            document.getElementById('totalServers').textContent = botStatus.servers.length;
            document.getElementById('totalBots').textContent = botStatus.servers.reduce((s, x) => s + (x.bots?.filter(b => b.connected).length || 0), 0);
            document.getElementById('totalPlayers').textContent = botStatus.servers.reduce((s, x) => s + (x.playersCount || 0), 0);
            
            document.getElementById('serversGrid').innerHTML = botStatus.servers.map(s => `
                <div class="card server-card">
                    <div class="card-body">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                            <div><strong>${s.name || s.host}</strong><br><small style="color: var(--muted)">${s.host}:${s.port}</small></div>
                            <span style="color: ${s.online ? 'var(--green)' : 'var(--red)'}">${s.online ? '✅' : '❌'}</span>
                        </div>
                        <div class="stats">
                            <div class="stat"><div class="stat-value">${s.playersCount || 0}</div><div class="stat-label">Players</div></div>
                            <div class="stat"><div class="stat-value">${s.bots?.filter(b => b.connected).length || 0}</div><div class="stat-label">Bots</div></div>
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function updatePlayers() {
            document.getElementById('playersList').innerHTML = Object.entries(playersData.players || {}).map(([name, data]) => `
                <div class="player-item" onclick="showPlayer('${name}')">
                    <div class="player-avatar">${name[0].toUpperCase()}</div>
                    <div class="player-info">
                        <div class="player-name">${name}</div>
                        <div class="player-meta">${data.messageCount || 0} msgs · ${data.servers?.length || 0} servers ${playersData.toxic?.includes(name) ? '<span class="tag tag-red">Tóxico</span>' : ''}</div>
                    </div>
                </div>
            `).join('');
        }
        
        function addLog(msg, level, sid, time) {
            const c = document.getElementById('logsContainer');
            const t = new Date(time || Date.now()).toLocaleTimeString();
            const e = document.createElement('div');
            e.className = 'log-entry log-' + (level || 'info');
            e.innerHTML = `<span class="log-time">[${t}]</span>${sid ? ` [${sid}]` : ''} ${msg}`;
            c.appendChild(e);
            c.scrollTop = c.scrollHeight;
            while (c.children.length > 200) c.removeChild(c.firstChild);
        }
        
        function clearLogs() { document.getElementById('logsContainer').innerHTML = ''; }
        
        function addServer() {
            const name = document.getElementById('serverName').value;
            const host = document.getElementById('serverHost').value;
            const port = parseInt(document.getElementById('serverPort').value) || 25565;
            if (!host) { toast('Host obrigatório!', 'error'); return; }
            socket.emit('server:add', { name: name || host, host, port });
            hideModal('server');
            document.getElementById('serverName').value = '';
            document.getElementById('serverHost').value = '';
        }
        
        function addMessage() { const i = document.getElementById('newMessage'); if (i.value.trim()) { socket.emit('message:add', i.value.trim()); i.value = ''; } }
        function removeMessage(i) { socket.emit('message:remove', i); }
        function saveSettings() { socket.emit('config:update', { botSettings: { announcementInterval: parseInt(document.getElementById('settingInterval').value) }, auth: { password: document.getElementById('settingPassword').value, autoRegister: true, autoLogin: true } }); toast('Salvo!', 'success'); }
        
        function showPlayer(name) {
            const d = playersData.players[name];
            if (!d) return;
            document.getElementById('playerPopupName').textContent = name;
            document.getElementById('playerPopupContent').innerHTML = `
                <p><strong>Servidores:</strong> ${(d.servers || []).map(s => `<span class="tag tag-blue">${s}</span>`).join('')}</p>
                <hr style="border-color: var(--border); margin: 10px 0;">
                <p><strong>Mensagens:</strong></p>
                ${(d.messages || []).slice(-10).reverse().map(m => `<div class="player-item"><small>${new Date(m.timestamp).toLocaleString()}</small><br>${m.message}</div>`).join('')}
            `;
            document.getElementById('playerPopup').classList.add('active');
        }
        
        function hidePopup() { document.getElementById('playerPopup').classList.remove('active'); }
        function showModal(n) { document.getElementById('modal-' + n).classList.add('active'); }
        function hideModal(n) { document.getElementById('modal-' + n).classList.remove('active'); }
        function toast(msg, type) { const c = document.getElementById('toasts'); const t = document.createElement('div'); t.className = 'toast'; t.style.borderLeft = type === 'success' ? '4px solid var(--green)' : type === 'error' ? '4px solid var(--red)' : '4px solid var(--accent)'; t.textContent = msg; c.appendChild(t); setTimeout(() => t.remove(), 5000); }
        
        document.querySelectorAll('.nav-item').forEach(i => i.addEventListener('click', () => { document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active')); document.querySelectorAll('.tab').forEach(t => t.classList.remove('active')); i.classList.add('active'); document.getElementById('tab-' + i.dataset.tab).classList.add('active'); }));
        document.addEventListener('DOMContentLoaded', connect);
    </script>
</body>
</html>
